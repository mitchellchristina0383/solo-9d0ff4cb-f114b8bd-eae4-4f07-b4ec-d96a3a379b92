services:
  natlab:
    build: .
    image: natlab:local
    container_name: natlab
    ports:
      - "${NATLAB_PORT:-8000}:8000"
    environment:
      # 冷却时长（演练秒），默认 60 秒；改小便于本地演示。
      NATLAB_COOLDOWN_SECONDS: "${NATLAB_COOLDOWN_SECONDS:-60}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
